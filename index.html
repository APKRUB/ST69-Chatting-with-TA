<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Support - สำหรับน้องๆ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

    <!-- หน้าจอ Login -->
    <div id="auth-container" class="flex flex-col items-center justify-center h-screen">
        <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-md text-center max-w-sm w-full border border-slate-100 dark:border-slate-800">
            <h1 class="text-2xl font-bold mb-2">Camp Support</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">ระบบแชทส่วนตัวและช่วยเหลือสำหรับน้องๆ</p>
            <button id="login-btn" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 py-3 rounded-xl font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.23 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.12 0 9.83 0 12s.43 3.88 1.18 5.38l4.09-3.14z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                <span>Login with Google</span>
            </button>
        </div>
    </div>

    <!-- หน้าจอหลักหลัง Login -->
    <div id="app-container" class="hidden flex h-screen">
        <div class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between p-4">
            <div>
                <h2 class="font-bold text-lg mb-6 text-indigo-600 dark:text-indigo-400">Camp Support</h2>
                <nav class="space-y-2">
                    <button onclick="switchTab('chat')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800 hover:text-indigo-600 font-medium transition flex justify-between items-center">
                        <span>💬 แชทส่วนตัวกับพี่</span>
                        <span id="badge-chat" class="hidden w-2.5 h-2.5 bg-red-500 rounded-full"></span>
                    </button>
                    <button onclick="switchTab('sos')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800 hover:text-indigo-600 font-medium transition">
                        <span>🚨 กดเรียกพี่ (SOS)</span>
                    </button>
                    <button onclick="switchTab('poll')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800 hover:text-indigo-600 font-medium transition">
                        <span>📊 แบบสำรวจ (Poll)</span>
                    </button>
                    <button onclick="switchTab('announcement')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800 hover:text-indigo-600 font-medium transition flex justify-between items-center">
                        <span>📢 ประกาศจากค่าย</span>
                        <span id="badge-ann" class="hidden w-2.5 h-2.5 bg-red-500 rounded-full"></span>
                    </button>
                </nav>
            </div>
            <div class="space-y-2 border-t border-slate-100 dark:border-slate-800 pt-3">
                <button onclick="toggleTheme()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-medium text-sm transition flex items-center gap-2">
                    🌓 <span id="theme-label">เปลี่ยนธีม</span>
                </button>
                <div class="flex items-center justify-between px-2">
                    <p id="user-info" class="text-xs text-slate-500 dark:text-slate-400 truncate max-w-[130px]"></p>
                    <button onclick="openSettings()" class="text-xs bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 px-2.5 py-1 rounded-lg transition font-medium">⚙️ ตั้งค่า</button>
                </div>
                <button id="logout-btn" class="w-full text-red-600 text-sm py-1.5 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-lg transition">ออกจากระบบ</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col">
            <!-- TAB 1: Chat -->
            <div id="tab-chat" class="tab-content flex-1 flex flex-col h-full">
                <div class="p-4 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex justify-between items-center">
                    <span class="font-bold text-slate-700 dark:text-slate-200">💬 แชทส่วนตัวกับพี่เลี้ยง (แสดงผล: เลขที่-ชื่อเล่น)</span>
                </div>
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 dark:bg-slate-950"></div>
                <div class="p-4 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex gap-2">
                    <input type="text" id="chat-input" placeholder="พิมพ์ข้อความปรึกษาพี่ๆ..." class="flex-1 border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500">
                    <button onclick="sendMessage()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-medium hover:bg-indigo-700 transition">ส่ง</button>
                </div>
            </div>

            <!-- TAB 2: SOS -->
            <div id="tab-sos" class="tab-content hidden flex-1 p-6 overflow-y-auto">
                <h2 class="text-xl font-bold mb-4">กดเรียกพี่เลี้ยงไปที่โต๊ะ</h2>
                <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 max-w-md space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">เลขที่โต๊ะ</label>
                        <input type="text" id="sos-table" placeholder="เช่น โต๊ะ 4" class="w-full border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">หัวข้อที่ติดปัญหา</label>
                        <input type="text" id="sos-topic" placeholder="เช่น ติดบั๊กโจทย์ BFS ข้อ 3" class="w-full border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <button onclick="sendSOS()" class="w-full bg-red-600 text-white py-3 rounded-xl font-medium hover:bg-red-700 transition">🚨 ส่งสัญญาณเรียกพี่</button>
                </div>
            </div>

            <!-- TAB 3: Poll (โหวต) -->
            <div id="tab-poll" class="tab-content hidden flex-1 p-6 overflow-y-auto">
                <h2 class="text-xl font-bold mb-4">📊 แบบสำรวจ (Poll)</h2>
                <div id="student-poll-list" class="space-y-4 max-w-lg"></div>
            </div>

            <!-- TAB 4: Announcement -->
            <div id="tab-announcement" class="tab-content hidden flex-1 p-6 overflow-y-auto">
                <h2 class="text-xl font-bold mb-4">ประกาศจากค่าย</h2>
                <div id="announcement-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- Modal ตั้งค่าข้อมูลส่วนตัว (Setting) -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-xl max-w-md w-full border border-slate-100 dark:border-slate-800 space-y-4">
            <h3 class="font-bold text-lg text-indigo-600 dark:text-indigo-400">⚙️️ ตั้งค่าข้อมูลส่วนตัว</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">ข้อมูลนี้จะถูกใช้แสดงผลในแชท (เลขที่-ชื่อเล่น)</p>
            <div>
                <label class="block text-sm font-medium mb-1">1. ชื่อจริง - นามสกุล</label>
                <input type="text" id="set-fullname" placeholder="เช่น อั่งเปา สวนกุหลาบ" class="w-full border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">2. ชื่อเล่น</label>
                <input type="text" id="set-nickname" placeholder="เช่น อั่งเปา" class="w-full border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">3. ระดับชั้น</label>
                <input type="text" id="set-grade" placeholder="เช่น ม.3/4" class="w-full border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">4. วันเดือนปีเกิด</label>
                <input type="date" id="set-dob" class="w-full border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">5. เลขที่</label>
                <input type="text" id="set-no" placeholder="เช่น 15" class="w-full border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="saveSettings()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-medium hover:bg-indigo-700 transition text-sm">บันทึกข้อมูล</button>
                <button onclick="closeSettings()" class="px-4 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 py-2.5 rounded-xl font-medium hover:bg-slate-300 transition text-sm">ยกเลิก</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=6"></script>
</body>
</html>
