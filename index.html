<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Support System</title>
    <!-- Tailwind CSS สำหรับแต่งหน้าเว็บให้สวยและไว -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- หน้าจอ Login (แสดงเฉพาะตอนยังไม่เข้าสู่ระบบ) -->
    <div id="auth-container" class="flex flex-col items-center justify-center h-screen">
        <div class="bg-white p-8 rounded-2xl shadow-md text-center max-w-sm w-full border border-slate-100">
            <h1 class="text-2xl font-bold mb-2">Camp Support System</h1>
            <p class="text-sm text-slate-500 mb-6">ระบบแชทและช่วยเหลือสำหรับน้องๆ ในค่าย</p>
            <button id="login-btn" class="w-full bg-slate-900 text-white py-3 rounded-xl font-medium hover:bg-slate-800 transition flex items-center justify-center gap-2">
                <span>Login with GitHub</span>
            </button>
        </div>
    </div>

    <!-- หน้าจอหลักหลัง Login แล้ว (ซ่อนไว้ก่อนจนกว่าจะล็อกอิน) -->
    <div id="app-container" class="hidden flex h-screen">
        <!-- Sidebar เมนูด้านซ้าย -->
        <div class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4">
            <div>
                <h2 class="font-bold text-lg mb-6 text-indigo-600">Camp Support</h2>
                <nav class="space-y-2">
                    <button onclick="switchTab('chat')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 font-medium transition">💬 แชทกับพี่เลี้ยง</button>
                    <button onclick="switchTab('sos')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 font-medium transition">🚨 กดเรียกพี่ (SOS)</button>
                    <button onclick="switchTab('announcement')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 font-medium transition">📢 ประกาศจากค่าย</button>
                </nav>
            </div>
            <div>
                <p id="user-info" class="text-xs text-slate-500 mb-2 truncate"></p>
                <button id="logout-btn" class="w-full text-red-600 text-sm py-2 hover:bg-red-50 rounded-lg transition">ออกจากระบบ</button>
            </div>
        </div>

        <!-- ส่วนแสดงเนื้อหาหลักด้านขวา -->
        <div class="flex-1 flex flex-col">
            <!-- TAB 1: หน้าแชท -->
            <div id="tab-chat" class="tab-content flex-1 flex flex-col h-full">
                <div class="p-4 border-b border-slate-200 bg-white font-bold text-slate-700">ห้องแชทรวม / ปรึกษาปัญหา</div>
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50"></div>
                <div class="p-4 bg-white border-t border-slate-200 flex gap-2">
                    <input type="text" id="chat-input" placeholder="พิมพ์ข้อความ..." class="flex-1 border border-slate-300 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500">
                    <button onclick="sendMessage()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-medium hover:bg-indigo-700 transition">ส่ง</button>
                </div>
            </div>

            <!-- TAB 2: หน้ากดเรียกพี่ (SOS) -->
            <div id="tab-sos" class="tab-content hidden flex-1 p-6 overflow-y-auto">
                <h2 class="text-xl font-bold mb-4">กดเรียกพี่เลี้ยงไปที่โต๊ะ</h2>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-md space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">เลขที่โต๊ะ</label>
                        <input type="text" id="sos-table" placeholder="เช่น โต๊ะ 4" class="w-full border border-slate-300 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">หัวข้อที่ติดปัญหา</label>
                        <input type="text" id="sos-topic" placeholder="เช่น ติดบั๊กโจทย์ BFS ข้อ 3" class="w-full border border-slate-300 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <button onclick="sendSOS()" class="w-full bg-red-600 text-white py-3 rounded-xl font-medium hover:bg-red-700 transition">🚨 ส่งสัญญาณเรียกพี่</button>
                </div>
            </div>

            <!-- TAB 3: หน้าประกาศ -->
            <div id="tab-announcement" class="tab-content hidden flex-1 p-6 overflow-y-auto">
                <h2 class="text-xl font-bold mb-4">ประกาศจากค่าย</h2>
                <div id="announcement-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- เรียกใช้ Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
