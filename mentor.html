<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Support - แดชบอร์ดพี่เลี้ยง</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- หน้าจอ Login สำหรับพี่เลี้ยง -->
    <div id="auth-container" class="flex flex-col items-center justify-center h-screen">
        <div class="bg-white p-8 rounded-2xl shadow-md text-center max-w-sm w-full border border-slate-100">
            <h1 class="text-2xl font-bold mb-2">Mentor Dashboard</h1>
            <p class="text-sm text-slate-500 mb-6">ระบบจัดการเคส SOS สำหรับพี่เลี้ยง</p>
            <button id="login-btn" class="w-full bg-white border border-slate-300 text-slate-700 py-3 rounded-xl font-medium hover:bg-slate-50 transition flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.23 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.12 0 9.83 0 12s.43 3.88 1.18 5.38l4.09-3.14z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                <span>Login with Google (Mentor)</span>
            </button>
        </div>
    </div>

    <!-- หน้าจอ Dashboard หลักของพี่เลี้ยง -->
    <div id="app-container" class="hidden flex h-screen">
        <div class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4">
            <div>
                <h2 class="font-bold text-lg mb-6 text-indigo-600">Mentor Panel</h2>
                <nav class="space-y-2">
                    <button onclick="switchTab('dashboard')" class="w-full text-left px-4 py-2 rounded-lg bg-indigo-50 text-indigo-600 font-medium transition">🛠️ จัดการเคส SOS</button>
                    <button onclick="switchTab('post-announcement')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 font-medium transition">📢 สร้างประกาศใหม่</button>
                </nav>
            </div>
            <div>
                <p id="user-info" class="text-xs text-slate-500 mb-2 truncate"></p>
                <button id="logout-btn" class="w-full text-red-600 text-sm py-2 hover:bg-red-50 rounded-lg transition">ออกจากระบบ</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col">
            <!-- TAB 1: Dashboard SOS -->
            <div id="tab-dashboard" class="tab-content flex-1 p-6 overflow-y-auto bg-slate-50">
                <h2 class="text-xl font-bold mb-1">แดชบอร์ดพี่เลี้ยง (SOS Queue)</h2>
                <p class="text-sm text-slate-500 mb-6">รายการเคสที่น้องๆ กดเรียกจากโต๊ะแบบ Real-time</p>
                <div id="mentor-sos-list" class="space-y-3"></div>
            </div>

            <!-- TAB 2: Post Announcement (แถมระบบให้พี่ๆ พิมพ์ประกาศได้ด้วยเลย!) -->
            <div id="tab-post-announcement" class="tab-content hidden flex-1 p-6 overflow-y-auto">
                <h2 class="text-xl font-bold mb-4">สร้างประกาศจากค่าย</h2>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-lg space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">หัวข้อประกาศ</label>
                        <input type="text" id="ann-title" placeholder="เช่น เปลี่ยนห้องเรียนช่วงบ่าย" class="w-full border border-slate-300 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">เนื้อหาประกาศ</label>
                        <textarea id="ann-content" rows="4" placeholder="รายละเอียดประกาศ..." class="w-full border border-slate-300 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500"></textarea>
                    </div>
                    <button onclick="postAnnouncement()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700 transition">📢 เผยแพร่ประกาศ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="mentor.js"></script>
</body>
</html>
