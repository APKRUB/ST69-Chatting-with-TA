<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Support - แดชบอร์ดพี่เลี้ยง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

    <!-- Login สำหรับพี่เลี้ยง -->
    <div id="auth-container" class="flex flex-col items-center justify-center h-screen">
        <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-md text-center max-w-sm w-full border border-slate-100 dark:border-slate-800">
            <h1 class="text-2xl font-bold mb-2">Mentor Dashboard</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">ระบบจัดการแชทส่วนตัวและประกาศสำหรับพี่เลี้ยง</p>
            <button id="login-btn" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 py-3 rounded-xl font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.23 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.12 0 9.83 0 12s.43 3.88 1.18 5.38l4.09-3.14z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                <span>Login with Google (Mentor)</span>
            </button>
        </div>
    </div>

    <!-- แดชบอร์ดหลักของพี่เลี้ยง -->
    <div id="app-container" class="hidden flex h-screen">
        <div class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between p-4">
            <div>
                <h2 class="font-bold text-lg mb-6 text-indigo-600 dark:text-indigo-400">Mentor Panel</h2>
                <nav class="space-y-2">
                    <button onclick="switchTab('dashboard')" class="w-full text-left px-4 py-2 rounded-lg bg-indigo-50 dark:bg-slate-800 text-indigo-600 font-medium transition flex justify-between items-center">
                        <span>🛠 จัดการเคส SOS</span>
                    </button>
                    <button onclick="switchTab('chat-rooms')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800 hover:text-indigo-600 font-medium transition flex justify-between items-center">
                        <span>💬 แชทส่วนตัวกับน้อง</span>
                        <span id="badge-mentor-chat" class="hidden w-2.5 h-2.5 bg-red-500 rounded-full"></span>
                    </button>
                    <button onclick="switchTab('post-announcement')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800 hover:text-indigo-600 font-medium transition">
                        <span>📢 จัดการประกาศ</span>
                    </button>
                </nav>
            </div>
            <div class="space-y-2">
                <button onclick="toggleTheme()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-medium text-sm transition flex items-center gap-2">
                    🌓 <span id="theme-label">เปลี่ยนธีม</span>
                </button>
                <p id="user-info" class="text-xs text-slate-500 dark:text-slate-400 truncate"></p>
                <button id="logout-btn" class="w-full text-red-600 text-sm py-2 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-lg transition">ออกจากระบบ</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col">
            <!-- TAB 1: Dashboard SOS -->
            <div id="tab-dashboard" class="tab-content flex-1 p-6 overflow-y-auto bg-slate-50 dark:bg-slate-950">
                <h2 class="text-xl font-bold mb-1">แดชบอร์ดพี่เลี้ยง (SOS Queue)</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">รายการเคสที่น้องๆ กดเรียกจากโต๊ะแบบ Real-time</p>
                <div id="mentor-sos-list" class="space-y-3"></div>
            </div>

            <!-- TAB 2: Chat Rooms -->
            <div id="tab-chat-rooms" class="tab-content hidden flex-1 flex h-full">
                <div class="w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col p-4">
                    <h3 class="font-bold text-slate-700 dark:text-slate-200 mb-3">เลือกโต๊ะที่ต้องการคุย</h3>
                    <div id="table-list" class="space-y-2 overflow-y-auto flex-1"></div>
                </div>
                <div class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-950">
                    <div class="flex justify-between items-center p-4 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
                        <div id="active-chat-title" class="font-bold text-slate-700 dark:text-slate-200">เลือกโต๊ะทางซ้ายเพื่อเริ่มสนทนา</div>
                        <button onclick="clearMentorChat()" class="text-xs bg-red-50 text-red-600 dark:bg-red-950/40 dark:text-red-400 px-2.5 py-1 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/40 transition">🗑️ เคลียร์แชทโต๊ะนี้</button>
                    </div>
                    <div id="mentor-chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3"></div>
                    <div class="p-4 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex gap-2">
                        <input type="text" id="mentor-chat-input" placeholder="พิมพ์ตอบกลับน้อง..." class="flex-1 border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500">
                        <button onclick="sendMentorMessage()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-medium hover:bg-indigo-700 transition">ตอบกลับ</button>
                    </div>
                </div>
            </div>

            <!-- TAB 3: Post & Manage Announcements -->
            <div id="tab-post-announcement" class="tab-content hidden flex-1 p-6 overflow-y-auto">
                <h2 class="text-xl font-bold mb-4">จัดการประกาศจากค่าย</h2>
                <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 max-w-lg space-y-4 mb-8">
                    <input type="hidden" id="ann-id">
                    <h3 id="ann-form-title" class="font-bold text-indigo-600 dark:text-indigo-400">📝 สร้างประกาศใหม่</h3>
                    <div>
                        <label class="block text-sm font-medium mb-1">หัวข้อประกาศ</label>
                        <input type="text" id="ann-title" placeholder="เช่น เปลี่ยนห้องเรียนช่วงบ่าย" class="w-full border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">เนื้อหาประกาศ</label>
                        <textarea id="ann-content" rows="4" placeholder="รายละเอียด..." class="w-full border border-slate-300 dark:border-slate-700 bg-transparent rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500"></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="saveAnnouncement()" id="ann-submit-btn" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700 transition">📢 เผยแพร่ประกาศ</button>
                        <button onclick="resetAnnForm()" id="ann-cancel-btn" class="hidden px-4 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 py-3 rounded-xl font-medium hover:bg-slate-300 transition">ยกเลิก</button>
                    </div>
                </div>
                <h3 class="font-bold text-lg mb-3">📌 ประกาศทั้งหมดในระบบ</h3>
                <div id="mentor-announcement-list" class="space-y-3 max-w-lg"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="mentor.js?v=6"></script>
</body>
</html>
